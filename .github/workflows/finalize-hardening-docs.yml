name: Finalize Hardening Docs

on:
  push:
    branches: [security-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-hardening
      - name: Apply fixed documentation replacements
        run: python3 scripts/finalize-hardening-docs.py
      - name: Commit documentation changes
        shell: bash
        run: |
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "No documentation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "docs: install from hardened fork"
          git push origin HEAD:security-hardening
